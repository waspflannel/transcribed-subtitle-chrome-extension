<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1000" viewBox="0 0 1400 1000" role="img" aria-labelledby="title desc">
  <title id="title">AI Language Subtitles cinematic study console</title>
  <desc id="desc">A stylized video scene with a glass subtitle rail, translation line, token chips, and timing controls.</desc>
  <defs>
    <linearGradient id="sky" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#0a0a0b"/>
      <stop offset="0.44" stop-color="#111827"/>
      <stop offset="1" stop-color="#3b2a13"/>
    </linearGradient>
    <linearGradient id="screen" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#202b34"/>
      <stop offset="0.6" stop-color="#101418"/>
      <stop offset="1" stop-color="#050506"/>
    </linearGradient>
    <linearGradient id="teal" x1="0" x2="1">
      <stop offset="0" stop-color="#5eead4"/>
      <stop offset="1" stop-color="#0f766e"/>
    </linearGradient>
    <radialGradient id="lamp" cx="50%" cy="46%" r="48%">
      <stop offset="0" stop-color="#f59e0b" stop-opacity="0.48"/>
      <stop offset="0.42" stop-color="#0f766e" stop-opacity="0.2"/>
      <stop offset="1" stop-color="#0a0a0b" stop-opacity="0"/>
    </radialGradient>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="24" stdDeviation="26" flood-color="#000000" flood-opacity="0.34"/>
    </filter>
    <filter id="glow">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="1400" height="1000" fill="url(#sky)"/>
  <circle cx="820" cy="430" r="520" fill="url(#lamp)"/>
  <path d="M0 780 C240 680 430 720 650 660 C880 598 1070 650 1400 520 L1400 1000 L0 1000 Z" fill="#060607" opacity="0.72"/>

  <g filter="url(#softShadow)">
    <rect x="120" y="96" width="1160" height="704" rx="28" fill="url(#screen)" stroke="#ffffff" stroke-opacity="0.12"/>
    <rect x="160" y="140" width="1080" height="608" rx="18" fill="#07090b"/>
    <path d="M160 140 H1240 V366 C1064 312 900 330 748 418 C592 508 426 500 160 430 Z" fill="#1b2630"/>
    <path d="M160 486 C310 430 438 455 592 526 C744 596 896 602 1240 468 V748 H160 Z" fill="#111418"/>
    <circle cx="466" cy="332" r="92" fill="#2c353a"/>
    <circle cx="466" cy="300" r="34" fill="#9b7d55"/>
    <path d="M384 430 C394 360 434 330 486 332 C548 336 588 386 596 454 C536 490 456 486 384 430 Z" fill="#243036"/>
    <rect x="202" y="184" width="222" height="16" rx="8" fill="#fdfcfb" opacity="0.15"/>
    <rect x="202" y="214" width="148" height="10" rx="5" fill="#5eead4" opacity="0.55"/>
    <rect x="1070" y="178" width="112" height="34" rx="17" fill="#0f766e" opacity="0.88"/>
    <circle cx="1092" cy="195" r="5" fill="#99f6e4" filter="url(#glow)"/>
    <rect x="1110" y="189" width="50" height="10" rx="5" fill="#ccfbf1"/>
  </g>

  <g filter="url(#softShadow)">
    <rect x="234" y="570" width="932" height="168" rx="22" fill="#0b0f14" fill-opacity="0.82" stroke="#ffffff" stroke-opacity="0.16"/>
    <rect x="258" y="594" width="884" height="8" rx="4" fill="#26323a"/>
    <rect x="258" y="594" width="372" height="8" rx="4" fill="url(#teal)"/>
    <rect x="620" y="591" width="38" height="14" rx="7" fill="#f59e0b"/>
    <text x="258" y="636" font-family="Inter, Arial, sans-serif" font-size="30" font-weight="700" fill="#fdfcfb">Je pensais connaitre cette scene par coeur.</text>
    <text x="258" y="676" font-family="Inter, Arial, sans-serif" font-size="24" font-weight="600" fill="#99f6e4">I thought I knew this scene by heart.</text>
    <g font-family="Inter, Arial, sans-serif" font-size="18" font-weight="700">
      <rect x="258" y="700" width="98" height="32" rx="8" fill="#f59e0b" fill-opacity="0.18" stroke="#f59e0b" stroke-opacity="0.55"/>
      <text x="276" y="722" fill="#fde68a">pensais</text>
      <rect x="366" y="700" width="116" height="32" rx="8" fill="#ffffff" fill-opacity="0.08" stroke="#ffffff" stroke-opacity="0.12"/>
      <text x="383" y="722" fill="#fdfcfb">connaitre</text>
      <rect x="492" y="700" width="88" height="32" rx="8" fill="#ffffff" fill-opacity="0.08" stroke="#ffffff" stroke-opacity="0.12"/>
      <text x="510" y="722" fill="#fdfcfb">scene</text>
      <rect x="590" y="700" width="102" height="32" rx="8" fill="#14b8a6" fill-opacity="0.16" stroke="#5eead4" stroke-opacity="0.5"/>
      <text x="610" y="722" fill="#ccfbf1">by heart</text>
    </g>
  </g>

  <g filter="url(#softShadow)">
    <rect x="928" y="244" width="238" height="258" rx="18" fill="#111827" fill-opacity="0.86" stroke="#ffffff" stroke-opacity="0.12"/>
    <text x="954" y="286" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="800" fill="#5eead4">TOKEN DETAIL</text>
    <text x="954" y="336" font-family="Space Grotesk, Arial, sans-serif" font-size="38" font-weight="700" fill="#fdfcfb">pensais</text>
    <text x="954" y="376" font-family="Inter, Arial, sans-serif" font-size="20" font-weight="600" fill="#fde68a">thought / believed</text>
    <rect x="954" y="404" width="76" height="28" rx="7" fill="#f59e0b" fill-opacity="0.18"/>
    <text x="972" y="423" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="800" fill="#fde68a">verb</text>
    <rect x="1040" y="404" width="86" height="28" rx="7" fill="#14b8a6" fill-opacity="0.16"/>
    <text x="1058" y="423" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="800" fill="#99f6e4">past</text>
    <path d="M954 456 H1126" stroke="#ffffff" stroke-opacity="0.12"/>
    <text x="954" y="480" font-family="Inter, Arial, sans-serif" font-size="14" fill="#cbd5e1">Used here to mark personal</text>
    <text x="954" y="501" font-family="Inter, Arial, sans-serif" font-size="14" fill="#cbd5e1">memory or assumption.</text>
  </g>
</svg>
